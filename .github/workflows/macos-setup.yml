name: Run MacOS setup script

on:
  push:
    paths:
      - '**/*.sh'
      - '**/macos-setup.yml'
  pull_request:
    paths:
      - '**/*.sh'
  workflow_dispatch:

jobs:
  run-setup:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run setup script & test command
        run: |
          cd installation/MacOS
          sh setup.sh
          vocabularyplus --version
