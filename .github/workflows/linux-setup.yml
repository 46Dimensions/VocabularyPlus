name: Run Linux setup script

on:
  push:
    paths:
      - '**/*.sh'
      - '**/linux-setup.yml'
  pull_request:
    paths:
      - '**/*.sh'
  workflow_dispatch:

jobs:
  run-setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run setup script
        run: |
          cd installation/Linux
          sh setup.sh

      - name: Test Vocabulary Plus
        run: vocabularyplus --version
