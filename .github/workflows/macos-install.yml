name: Run Bash Installer on macOS

on:
  push:
    paths:
      - '**/*.sh'

jobs:
  run-install:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x install.sh

      - name: Run install.sh
        run: ./install.sh
