name: Run Windows setup script

on:
  push:
    paths:
      - '**/*.ps1'
  pull_request:
    paths:
      - '**/*.ps1'
  workflow_dispatch:

jobs:
  run-setup:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run setup script
        shell: pwsh
        run: |
          Set-Location installation/Windows
          Unblock-File -Path .\setup.ps1
          .\setup.ps1
